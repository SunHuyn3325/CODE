<div class="blog-detail-page">
	<div class="state" *ngIf="loading">Đang tải bài viết...</div>
	<div class="state error" *ngIf="!loading && errorMsg">{{ errorMsg }}</div>

	<ng-container *ngIf="!loading && blog">
		<section class="hero">
			<img class="hero-image" [src]="getImageSrc(blog.thumbnail)" [alt]="blog.title">
			<div class="hero-overlay"></div>
			<div class="hero-content">
				<h1>{{ blog.title }}</h1>
				<div class="meta">
					<span>{{ blog.createdAt | date:'dd/MM/yyyy' }}</span>
					<span>•</span>
					<span>{{ getReadTime(blog.content) }}</span>
				</div>
				<p class="lead">{{ getExcerpt(blog) }}</p>
			</div>
		</section>

		<section class="content-wrap">
			<article class="article" [innerHTML]="blog.content"></article>
		</section>

		<section class="related" *ngIf="relatedBlogs.length > 0">
			<h2>Bài viết liên quan</h2>
			<div class="related-grid">
				<article class="related-card" *ngFor="let item of relatedBlogs" [routerLink]="['/blogs', item._id]">
					<img [src]="getImageSrc(item.thumbnail)" [alt]="item.title">
					<div class="related-body">
						<h3>{{ item.title }}</h3>
						<p>{{ getExcerpt(item) }}</p>
					</div>
				</article>
			</div>
		</section>
	</ng-container>
</div>
