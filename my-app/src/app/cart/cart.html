<div class="checkout-container">
  <!-- LEFT: FORM -->
  <div class="checkout-left">
    <h2>Thông tin giao hàng</h2>

    <input type="text" placeholder="Họ và tên" [(ngModel)]="form.name" />
    <input type="text" placeholder="Số điện thoại" [(ngModel)]="form.phone" />
    <input type="email" placeholder="Email" [(ngModel)]="form.email" />
    <input type="text" placeholder="Địa chỉ" [(ngModel)]="form.address" />

    <div class="address-select">
      <select (change)="onProvinceChange($event)">
        <option>Chọn Tỉnh, Thành phố</option>
        <option *ngFor="let p of provinces" [value]="p.code">{{p.name}}</option>
      </select>

      <select (change)="onDistrictChange($event)">
        <option>Chọn Quận, Huyện</option>
        <option *ngFor="let d of districts" [value]="d.code">{{d.name}}</option>
      </select>

      <select (change)="onWardChange($event)">
        <option>Chọn Phường, Xã</option>
        <option *ngFor="let w of wards" [value]="w.code">{{w.name}}</option>
      </select>
    </div>

    <h3>Phương thức vận chuyển</h3>

    <h3>Phương thức thanh toán</h3>
    <div class="payment-box">
      <input type="radio" checked />
      <span>Thanh toán online qua VNPay</span>
    </div>
  </div>

  <!-- RIGHT: ORDER -->
  <div class="checkout-right">
    <div class="cart-item" *ngFor="let item of cart">
      <img [src]="item.image" />
      <div>
        <p>{{item.name}}</p>
        <span>{{item.variant}}</span>
      </div>
      <div class="price">{{item.price | currency:'VND'}}</div>
    </div>

    <input type="text" placeholder="Nhập mã giảm giá" />

    <div class="summary">
      <p>Tạm tính: {{total | currency:'VND'}}</p>
      <p>Phí vận chuyển: TBD</p>
      <h3>Tổng: {{total | currency:'VND'}}</h3>
    </div>

    <button (click)="submitOrder()">Đặt hàng</button>
  </div>
</div>
