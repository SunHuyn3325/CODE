<button class="mobile-menu-btn" (click)="toggleMobileSidebar()" *ngIf="!isMobileSidebarOpen">
  Menu
</button>

<div class="mobile-overlay" *ngIf="isMobileSidebarOpen" (click)="closeMobileSidebar()"></div>

<aside class="account-sidebar" [class.mobile-open]="isMobileSidebarOpen">
  <button class="mobile-close-btn" (click)="closeMobileSidebar()">x</button>

  <div class="user-section">
    <img class="user-avatar" [src]="userAvatar" alt="Avatar" />
    <h3 class="user-name">{{ userName }}</h3>
    <p class="user-email" *ngIf="userEmail">{{ userEmail }}</p>
  </div>

  <nav class="sidebar-nav">
    <a
      class="menu-link"
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="closeMobileSidebar()"
    >
      {{ item.label }}
    </a>
  </nav>

  <button class="logout-btn" (click)="onLogout()">Dang xuat</button>
</aside>
